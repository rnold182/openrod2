# DOSBox Staging config to run the original Street Rod 2 as a reference.
# Plain AdLib card (OPL2, no Sound Blaster), recordings go to SR2\capture.
[sblaster]
sbtype = none
oplmode = opl2

[cpu]
cpu_cycles = 3000

[capture]
capture_dir = C:\Users\inact\SR2\capture

[autoexec]
mount c "C:\Users\inact\SR2"
c:
SR.EXE
